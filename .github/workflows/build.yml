name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Check mobile flows and local persistence
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/wine-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:mobile
          npm run test:persistence
          npm run test:manual
          npm run test:backup

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: wine-wisky-web
          path: dist
